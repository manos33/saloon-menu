<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A5 Table Card - Saloon Beach Bar</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Literata:opsz,wght@7..72,300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #EBE0D2;
      --text: #402f24;
      --gold: #d4a96a;
      --terracotta: #c06c54;
      --font-primary: 'Literata', serif;
      --font-sec: 'Jost', sans-serif;
    }
    
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      padding: 0;
      background: #2a2a2a; /* Dark background so you can see the card edges on your screen */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: var(--font-primary);
    }

    /* True A5 physical dimensions in millimeters */
    .a5-card {
      width: 148mm;
      height: 210mm;
      background-color: var(--bg);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
      padding: 15mm;
    }

    /* When you hit "Print", this forces the printer to use exact A5 size and removes shadows */
    @media print {
      body { background: none; }
      .a5-card { box-shadow: none; }
      @page { size: A5; margin: 0; }
    }

    /* A very subtle palm leaf background texture for luxury vibe */
    .palm-overlay {
      position: absolute;
      top: -10%; left: -20%; right: -20%; bottom: -10%;
      opacity: 0.04;
      background-image: url('palm-leaf.png');
      background-size: cover;
      background-position: center;
      pointer-events: none;
      z-index: 0;
    }

    .content-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      width: 100%;
      text-align: center;
    }

    /* Vescovi Word Logo at the top */
    .logo-container {
      margin-top: 5mm;
      width: 70mm;
      height: 22mm;
      background-color: var(--text); /* Dark brown color */
      -webkit-mask-image: url('VescoviWord.png');
      mask-image: url('VescoviWord.png');
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
    }

    .qr-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 5mm;
    }

    .scan-title {
      font-family: var(--font-sec);
      font-size: 15px;
      letter-spacing: 6px;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--terracotta);
      margin-bottom: 4px;
    }

    .scan-subtitle {
      font-family: var(--font-primary);
      font-size: 19px;
      font-style: italic;
      color: var(--text);
      margin-bottom: 12mm;
    }

    /* White rounded box behind the QR code to make it pop */
    .qr-wrapper {
      background: white;
      padding: 7mm;
      border-radius: 6mm;
      box-shadow: 0 8px 25px rgba(64, 47, 36, 0.1);
      border: 1px solid rgba(212, 169, 106, 0.4); /* Subtle gold border */
    }

    .qr-image {
      width: 48mm;
      height: 48mm;
      display: block;
      /* If the QR is black, we can tint it terracotta using a CSS filter, but we'll leave it as is for scannability */
    }

    /* WiFi Section at the bottom */
    .wifi-section {
      margin-top: auto;
      margin-bottom: 10mm;
      border-top: 1px solid rgba(64, 47, 36, 0.15);
      border-bottom: 1px solid rgba(64, 47, 36, 0.15);
      padding: 7mm 0;
      width: 85%;
    }

    .wifi-label {
      font-family: var(--font-sec);
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--terracotta);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .wifi-details {
      font-family: var(--font-primary);
      font-size: 14px;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .wifi-details div {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .wifi-title {
      font-family: var(--font-sec);
      font-size: 11px;
      letter-spacing: 1px;
      opacity: 0.7;
    }

    .footer-url {
      font-family: var(--font-sec);
      font-size: 11px;
      letter-spacing: 3px;
      color: rgba(64, 47, 36, 0.6);
      margin-bottom: 2mm;
    }
  </style>
</head>
<body>
  
  <div class="a5-card">
    <div class="palm-overlay"></div>
    <div class="content-wrapper">
      
      <!-- LOGO -->
      <div class="logo-container"></div>

      <!-- QR SECTION -->
      <div class="qr-section">
        <div class="scan-title">Digital Menu</div>
        <div class="scan-subtitle">Σαρώστε για να ανακαλύψετε</div>
        
        <div class="qr-wrapper">
          <img src="QrMenu.png" alt="QR Code" class="qr-image">
        </div>
      </div>

      <!-- WIFI SECTION -->
      <div class="wifi-section">
        <div class="wifi-label">Stay Connected</div>
        <div class="wifi-details">
          <!-- Change these to your real WiFi details in the code! -->
          <div><span class="wifi-title">NETWORK:</span> <b>Saloon_Guest</b></div>
          <div><span class="wifi-title">PASSWORD:</span> <b>saloon2026</b></div>
        </div>
      </div>

      <!-- FOOTER -->
      <div class="footer-url">
        MENU.SALOONBEACHBAR.COM
      </div>

    </div>
  </div>

</body>
</html>
